name: PR closes an issue

# 342 open issues, 329 of them touched within the month: nothing here is rotting,
# the drain is just clogged. Only 8 of 35 open PRs carried a closing keyword, so
# work ships and its issue stays open, and nobody can tell which of the 342 are
# already done. That is how 121 issues end up on one milestone.
#
# This check asks every PR to close an issue, reference one with `Refs #N`, or
# say why it has none (`No-Issue:`). The opt-out is one line, so this is a
# prompt, not a wall. It also fails a negated closing keyword ("does not close
# #N"), which GitHub would otherwise act on and close the issue.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  link:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Automated dependency bumps (dependabot and any other GitHub-verified
      # bot account) are machine-generated and can never carry a closing
      # keyword; failing them here would require hand-editing every bot body,
      # which defeats the automation. The gate stays strict for every human
      # PR. `user.type` is set by GitHub for verified bot accounts, so a PR
      # author cannot spoof it to dodge the check.
      - name: Require an issue link or an explicit opt-out
        if: github.event.pull_request.user.type != 'Bot'
        env:
          # Fetched live rather than read from the event payload. A rerun
          # replays the payload the run started with, so a body-only fix could
          # never turn this check green: the obvious operator move — add the
          # missing line, rerun the failed check — re-read the old body and
          # failed again with no hint why. Reading the current body makes a
          # rerun mean what everyone already assumes it means.
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Through a variable, never interpolated into the script body:
          # a PR body is attacker-controlled text.
          PR_BODY=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json body --jq '.body // ""')
          # Body only, deliberately. GitHub resolves closing keywords from the
          # PR description; a "Closes #123" in the title auto-closes nothing.
          # Accepting the title here would pass PRs that never close an issue,
          # which is the exact false-assurance this check exists to prevent.
          text="${PR_BODY:-}"

          # GitHub resolves a closing keyword wherever it appears, negated or
          # not: PR #6371 said "does not close #6184", GitHub put #6184 in
          # closingIssuesReferences, and the P1 closed on merge. A keyword a
          # few words after a negation is always that mistake, so fail first.
          # The reference takes all three forms GitHub closes on: #N,
          # owner/repo#N and a full issue URL.
          keyword='(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]*:?[[:space:]]*([[:alnum:]_.-]+/[[:alnum:]_.-]+#|#|https?://github\.com/[[:alnum:]_.-]+/[[:alnum:]_.-]+/issues/)[0-9]+'
          negation="(\\b(not|never|no longer|without)|n't)([[:space:]]+[[:alnum:]'-]+){0,3}[[:space:]]+"
          # `|| true`, not `| head`: under pipefail a SIGPIPE'd grep would turn a
          # hit into a miss.
          negated=$(grep -m1 -oiE "${negation}${keyword}" <<<"$text" || true)
          if [ -n "$negated" ]; then
            cat >&2 <<MSG
          Negated closing keyword found: "${negated}"

          GitHub closes the issue anyway: it ignores the "not". Reword it as

            Refs #1234                (the PR relates to the issue; nothing closes)

          and keep Closes / Fixes / Resolves for the issue this PR really finishes.
          MSG
            exit 1
          fi

          # GitHub's own closing-keyword set, plus the #N it must attach to.
          if grep -qiE "\\b${keyword}" <<<"$text"; then
            echo "Closing keyword found — this PR will close its issue on merge."
            exit 0
          fi

          # Opt-outs. `Refs #N` links the issue without closing it; `No-Issue:`
          # takes a one-line reason for work that has no issue at all.
          if grep -qiE '^[[:space:]]*Refs?:?[[:space:]]+#[0-9]+' <<<"$text"; then
            echo "Linked without closing — $(grep -iE '^[[:space:]]*Refs?:?[[:space:]]+#[0-9]+' <<<"$text" | head -1)"
            exit 0
          fi
          if grep -qiE '^[[:space:]]*No-Issue:[[:space:]]*\S' <<<"$text"; then
            reason=$(grep -iE '^[[:space:]]*No-Issue:' <<<"$text" | head -1)
            echo "Opted out — ${reason}"
            exit 0
          fi

          cat >&2 <<'MSG'
          This PR neither links an issue nor says why it doesn't.

          Add one of these lines to the PR body:

            Closes #1234              (only when this PR finishes the issue; Fixes / Resolves also close)
            Refs #1234                (related or partial work; the issue stays open)
            No-Issue: <one-line why>  (chores, docs typos, revert, dependency bump)

          Write a closing keyword only when you mean it: GitHub closes the issue
          on merge even inside "does not close #1234".
          MSG
          exit 1
