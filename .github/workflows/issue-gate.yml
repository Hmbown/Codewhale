name: Contribution intake - issues

on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # Labels only, never comments (founder, 2026-09-22): the intake note used
      # to thank other bots, and a comment is noise a label does not make.
      # Maintainers still see who needs triage; `/lgtmi` still skips it.
      - name: Label new external issues for triage
        uses: actions/github-script@v9
        with:
          script: |
            const issue = context.payload.issue;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const privileged = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);

            async function label(name, color, description) {
              try {
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
              } catch (error) {
                if (error.status !== 422) throw error; // 422: label already exists
              }
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issue.number,
                labels: [name],
              });
            }

            if (privileged.has(issue.author_association)) return;
            // `user.type` is set by GitHub for app and bot accounts and cannot
            // be spoofed by a login that merely ends in "[bot]".
            if (issue.user.type === 'Bot') {
              await label('bot-authored', 'ededed', 'Opened by a bot or app account');
              return;
            }

            function parseAllowlist(content) {
              return new Set(
                content
                  .split(/\r?\n/)
                  .map(line => line.replace(/#.*/, '').trim().toLowerCase())
                  .filter(Boolean)
              );
            }

            async function readAllowlist() {
              try {
                const { data } = await github.rest.repos.getContent({
                  owner,
                  repo,
                  path: '.github/APPROVED_CONTRIBUTORS',
                  ref: context.payload.repository.default_branch,
                });
                if (Array.isArray(data) || data.type !== 'file') return new Set();
                return parseAllowlist(
                  Buffer.from(data.content, data.encoding || 'base64').toString('utf8')
                );
              } catch (error) {
                if (error.status === 404) return new Set();
                throw error;
              }
            }

            const allowlist = await readAllowlist();
            const login = issue.user.login.toLowerCase();
            if (
              allowlist.has(`all:${login}`) ||
              allowlist.has(`issue:${login}`)
            ) {
              return;
            }

            await label(
              'needs-triage',
              'fbca04',
              'New external report awaiting maintainer triage; repro, logs and version output help'
            );
