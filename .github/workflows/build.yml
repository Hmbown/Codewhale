name: Build AsBudy

# 触发条件（2026-09-18 改）
#   以前是「push 到 main 就编」。但日常改动几乎全在 `crates/tui/src/runtime_web/`（前端资源）——
#   门卫是从**源码目录现读**它们的（`server.js` 的 WEB_SRC），**不用进二进制**也能用，
#   于是每次 push 都白跑 ~19 分钟。
#   现在：只改这些「不需要编译的东西」时不触发；碰了别的（Rust 源码 / Cargo / 构建脚本）照旧自动编；
#   想编随时手动点（workflow_dispatch）。
#   ⚠️ 为什么用 paths-ignore 而不是「只留手动」：改了 Rust 却忘了点编译 → 线上会一直跑旧程序
#      而没人发现（档案 §8.7 ④ 那类「二进制从哪来」的坑）。宁可多飞一次，也别默默少编一次。
on:
  push:
    branches: [main]
    paths-ignore:
      - 'crates/tui/src/runtime_web/**'   # 前端资源：门卫现读源码目录，不进二进制也能用
      - '.github/**'                       # 改 CI 配置本身不必重编
      - '**/*.md'                          # 文档
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-x64:
    name: Build linux-x64
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils musl-tools

      - name: Build
        run: cargo build --profile dist --locked --target x86_64-unknown-linux-musl -p codewhale-cli

      - name: Stage binary
        run: |
          cp target/x86_64-unknown-linux-musl/dist/codewhale asbudy-linux-x64
          ls -la asbudy-linux-x64

      - name: Verify our frontend made it in
        # 2026-09-15：防「编译漏功能」—— 我们的改动集中在界面几个文件里，
        # 编译完先拿标记 grep 一遍产物；缺任何一个就失败，别把残的二进制发出去。
        # （本地对应工具：m0/scripts/fork-manifest.sh verify-bin）
        run: |
          fail=0
          # ⚠️ 只查「真正被编进二进制」的东西：crates/tui/src/runtime_api/web.rs 里
          #    include_str! 的只有 index.html / styles.css / app.mjs（+ 图标）。
          #    asbudy-files.js / asbudy-my.js 是门卫现读的，不在二进制里 ——
          #    那两个文件的检查走本地 m0/scripts/fork-manifest.sh verify（2026-09-15 踩过）。
          for m in "asbudy-files.js" "asbudy-my.js" "asbudy:activity" "asbudy-files" "asbudy-undo" "查看回执" "思考过程" "AsBudy"; do
            if grep -a -q -- "$m" asbudy-linux-x64; then
              echo "✅ $m"
            else
              echo "❌ $m 没编进去"
              fail=1
            fi
          done
          exit $fail

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: asbudy-linux-x64
          path: asbudy-linux-x64
          retention-days: 30

      - name: Publish release
        # tag 以前写死 v0.1.0 → 每次编译都往同一个 Release 上盖，等于没发新版
        # （2026-09-15 发现：Release 停在 09-13）。改成按构建号发，每次都有得下。
        uses: softprops/action-gh-release@v2
        with:
          files: asbudy-linux-x64
          tag_name: build-${{ github.run_number }}
          name: AsBudy build ${{ github.run_number }} · ${{ github.sha }}
