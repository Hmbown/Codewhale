name: Pet conformance

on:
  pull_request:
    paths:
      - 'pet/**'
      - 'crates/tui/src/tui/pet_watch/**'
      - 'crates/tui/src/tui/ambient_life/pet_*'
      - 'crates/tui/src/tui/ambient_life/whale-points.tsv'
      - 'npm/runtime-sdk/**'
      - '.github/workflows/pet.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pet-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pet/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm --prefix pet ci --ignore-scripts
      - run: npm --prefix pet run check
      - run: npm --prefix pet run sync
      - name: Embedded sources match canonical core
        run: git diff --exit-code -- crates/tui/src/tui/pet_watch/pet-native.js pet/ios/Resources
      - run: cargo fetch --locked --manifest-path pet/tui/Cargo.toml
      - name: TypeScript and Rust parity, including reduced motion
        run: ./pet/verify.sh --no-swift
  recorder:
    name: recorder (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pet/package-lock.json
      - run: npm --prefix pet ci --ignore-scripts
      - run: npm --prefix pet run check
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable emulator acceleration on the disposable runner
        run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: false
          working-directory: pet/android
          script: ./gradlew --no-daemon assembleDebug connectedDebugAndroidTest lintDebug
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: codewhale-pet-android
          path: |
            pet/android/build/outputs/apk/debug/*.apk
            pet/android/build/reports/androidTests/
            pet/android/build/reports/lint-results-debug.*
