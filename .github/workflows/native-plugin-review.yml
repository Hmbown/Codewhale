name: Native plugin verification
on:
  push:
    branches: [feat/native-plugin-login-install]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary verification scaffold from contribution
        run: |
          mkdir -p "$RUNNER_TEMP/native-results"
          git rm .github/workflows/native-plugin-review.yml
          git -c user.name=LIghtJUNction -c user.email=lightjunction.me@gmail.com commit -m 'chore: keep verification infrastructure out of upstream diff'
          git push origin HEAD:feat/native-plugin-login-install
          git rev-parse HEAD > "$RUNNER_TEMP/native-results/commit.txt"
      - name: Install existing upstream build dependencies
        run: bash scripts/ci-apt-install.sh libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-plugin-login-review
          cache-on-failure: true
      - name: Check Rust packages including test code
        run: |
          set -o pipefail
          cargo check -p codewhale-tui -p codewhale-cli --tests --locked 2>&1 | tee "$RUNNER_TEMP/native-results/cargo-check.log"
      - name: Check localization
        if: always()
        run: |
          set -o pipefail
          cargo test -p codewhale-localization --locked 2>&1 | tee "$RUNNER_TEMP/native-results/localization.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-plugin-verification
          path: ${{ runner.temp }}/native-results
          retention-days: 3
