name: Native plugin integration review
on:
  push:
    branches: [feat/native-plugin-login-install]
permissions:
  contents: write
jobs:
  implement-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-plugin-login-review
      - name: Apply the reviewed source edits
        run: |
          python3 .native-plugin-edit.py
          git diff --name-only -- '*.rs' | xargs -r rustfmt --edition 2024 --config skip_children=true
          git diff --check
          mkdir -p "$RUNNER_TEMP/native-results"
          git diff --binary > "$RUNNER_TEMP/native-results/changes.patch"
          git rm .native-plugin-edit.py .github/workflows/native-plugin-review.yml
          git add crates/cli/src/lib.rs crates/localization crates/tui/src docs/PLUGINS.md docs/PLUGIN_PROVIDERS.md docs/features.toml
          git -c user.name=LIghtJUNction -c user.email=lightjunction.me@gmail.com commit -m 'feat(plugins): unify installation and native OAuth sign-in' -m 'Reuse the existing reviewed installer and host OAuth owner. Add codewhale install, pinned npm/GitHub sources, /login provider and /logout provider; remove API-key entry for plugin OAuth. Keep plugin catalogs account-scoped. Local baseline plugin checks: 62 passed; upstream compile receipt is recorded by this workflow.'
          git push origin HEAD:feat/native-plugin-login-install
          git rev-parse HEAD > "$RUNNER_TEMP/native-results/commit.txt"
      - name: Check changed Rust packages and their test code
        run: |
          set -o pipefail
          cargo check -p codewhale-tui -p codewhale-cli --tests --locked 2>&1 | tee "$RUNNER_TEMP/native-results/cargo-check.log"
      - name: Run localization checks
        if: success()
        run: |
          set -o pipefail
          cargo test -p codewhale-localization --locked 2>&1 | tee "$RUNNER_TEMP/native-results/localization.log"
      - name: Check blocking-call budget
        if: always()
        run: python3 scripts/check-blocking-calls-budget.py > "$RUNNER_TEMP/native-results/blocking-budget.log" 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-plugin-review-results
          path: ${{ runner.temp }}/native-results
          retention-days: 3
