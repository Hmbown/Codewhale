<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#020711">
    <title>AsBudy</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/assets/codewhale-web.css">
    <script type="module" src="/assets/codewhale-web.js"></script>
    <!-- AsBudy 扩展：目录树 / 退回 / 「我的」菜单（真身在 runtime_web/，由 gate 提供数据） -->
    <script defer src="/assets/asbudy-files.js"></script>
    <script defer src="/assets/asbudy-my.js"></script>
  </head>
  <body>
    <div class="shell" id="app-shell">
      <aside class="rail" id="thread-rail" aria-label="会话" tabindex="-1">
        <div class="rail-brand">
          <img class="brand-mark" src="/assets/codewhale-192.png" alt="">
          <div>
            <p class="brand-name">AsBudy</p>
            <p class="brand-context">本地引擎</p>
          </div>
          <button class="quiet-button rail-close" id="rail-close" type="button" aria-label="关闭会话栏">关闭</button>
        </div>

        <button class="primary-button new-thread" id="new-thread" type="button">
          新建会话
        </button>

        <label class="search-field">
          <span class="sr-only">搜索会话</span>
          <input id="thread-search" type="search" autocomplete="off" placeholder="搜索会话">
        </label>

        <!-- AsBudy 扩展骨架（2026-09-14 从门卫注入搬进这里）：目录树两张卡片 + 退回面板。
             动态数据（data-pkey / data-kind / 项目名）由 asbudy-files.js / asbudy-my.js 自取。 -->
        <div id="asbudy-files" data-pkey="" data-kind="proxy" hidden>
          <div class="asb-card" id="asb-card-proj">
            <div class="asb-hd"><span class="asb-fold" id="asb-fold-proj" title="折叠 / 展开">▾</span><span class="asb-title">项目文件</span><span class="asb-tools"><span id="asbudy-files-refresh">刷新</span></span></div>
            <div class="asb-bd" id="asbudy-files-body"><span class="f-empty">加载中…</span></div>
          </div>
          <div class="asb-card" id="asb-card-mine">
            <div class="asb-hd"><span class="asb-fold" id="asb-fold-mine" title="折叠 / 展开">▾</span><span class="asb-title">我的资料<span id="asb-mine-count"></span></span><span class="asb-tools"><span id="asbudy-files-upload" title="传资料 —— 存到「我的资料」，AI 直接能读">+ 传资料</span></span></div>
            <div class="asb-bd" id="asbudy-mine-body"><span class="f-empty">加载中…</span></div>
          </div>
        </div>
        <div id="asbudy-undo" hidden>
          <div class="f-head"><span>退回</span><span id="asbudy-undo-refresh">刷新</span></div>
          <div id="asbudy-undo-body"><span class="f-empty">加载中…</span></div>
        </div>

        <nav class="thread-list" id="thread-list" aria-label="进行中的会话"></nav>

        <!-- Read-only peek for a selected saved session. Bounded and redacted
             server-side by GET /v1/sessions/{id}?peek=true; this pane never
             receives a full transcript and never offers a composer. -->
        <!-- (rendered into #session-peek in the main column) -->

        <!-- Saved sessions come from GET /v1/sessions/summary, the same
             projection the terminal's session rail renders. Resuming one goes
             through POST /v1/sessions/{id}/resume-thread, so the dashboard
             never gets a second session backend. -->
        <section class="saved-sessions" id="saved-sessions" hidden>
          <h2 class="rail-section-title" id="saved-sessions-title">已保存的会话</h2>
          <nav class="thread-list" id="session-list" aria-labelledby="saved-sessions-title"></nav>
        </section>

        <div class="rail-footer">
          <span class="connection-dot" id="connection-dot" aria-hidden="true"></span>
          <span class="connection-copy">
            <span id="connection-label">正在连接本地引擎…</span>
            <span class="runtime-provenance" id="runtime-provenance">版本未知 · 来源未知</span>
          </span>
          <button class="quiet-button" id="archived-toggle" type="button" style="margin-left:auto;flex:0 0 auto;padding:0 8px;min-height:26px;font-size:11px" hidden>已归档</button>
        </div>
      </aside>

      <button class="rail-scrim" id="rail-scrim" type="button" aria-label="关闭会话栏" tabindex="-1" hidden></button>

      <main class="session">
        <header class="session-header">
          <div class="session-heading">
            <button class="quiet-button rail-open" id="rail-open" type="button" aria-controls="thread-rail" aria-expanded="false">会话</button>
            <div class="title-stack">
              <p class="eyebrow" id="session-kicker">AsBudy</p>
              <h1 id="session-title">选择一个会话</h1>
            </div>
          </div>
          <div class="header-actions">
            <button class="quiet-button" id="rename-thread" type="button" disabled>重命名</button>
            <button class="quiet-button danger" id="archive-thread" type="button" disabled>归档</button>
          </div>
          <div class="session-facts" id="session-facts" aria-label="会话详情"></div>
        </header>

        <div class="status-banner" id="status-banner" role="status" aria-live="polite" hidden></div>

        <section class="session-peek" id="session-peek" aria-label="已保存会话预览" hidden></section>

        <section class="transcript" id="transcript" role="log" aria-label="对话" aria-live="polite" aria-relevant="additions" aria-atomic="false">
          <div class="empty-state">
            <img class="empty-mark" src="/assets/codewhale-192.png" alt="">
            <h2>你的本地智能体，就在浏览器里。</h2>
            <p>新建一个会话，或从侧栏选择一个。此客户端与终端使用同一个运行时。</p>
          </div>
        </section>

        <section class="attention" id="attention" role="region" aria-label="需要处理的事项" aria-live="assertive" aria-relevant="additions" aria-atomic="false" hidden></section>

        <footer class="composer-wrap">
          <form class="composer" id="composer">
            <label class="sr-only" for="composer-input">给 AsBudy 发消息</label>
            <textarea id="composer-input" rows="1" placeholder="让 AsBudy 在这个仓库里工作…" disabled></textarea>
            <div class="composer-bar">
              <span class="composer-hint">回车发送 · Shift+回车换行</span>
              <div class="composer-actions">
                <button class="quiet-button" id="interrupt-turn" type="button" hidden>停止</button>
                <button class="send-button" id="send-message" type="submit" disabled>发送</button>
              </div>
            </div>
          </form>
        </footer>
      </main>

      <!-- 预览栏（三栏右侧）—— 门卫脚本按当前项目决定是否显示；窄屏时变全屏层 -->
      <section class="preview-pane" id="preview-pane" aria-label="预览">
        <div class="preview-grip" id="preview-grip" title="拖动调宽度"></div>
        <div class="preview-head">
          <span class="preview-title">预览</span>
          <span class="preview-acts">
            <button class="quiet-button" id="preview-sys" type="button" title="切回看系统页面" hidden>看系统</button>
            <button class="quiet-button" id="preview-reload" type="button" title="重新加载">刷新</button>
            <button class="quiet-button" id="preview-close" type="button" title="收起预览">收起</button>
          </span>
        </div>
        <iframe id="preview-frame" title="项目实时预览" src="about:blank"></iframe>
        <div class="preview-file" id="preview-file" hidden></div>
      </section>

      <!-- 预览栏收起后的「展开」按钮（与侧栏的 «☰ 侧栏» 对称，在右上角） -->
      <button class="preview-reveal" id="preview-reveal" type="button" title="展开预览">👁 预览</button>

      <!-- 手机底部三格（宽屏不显示）—— 跟它说 / 文件 / 预览 -->
      <nav class="mbar-mobile" id="asbudy-mbar" aria-label="视图切换">
        <button type="button" data-mtab="chat"><i>💬</i>跟它说</button>
        <button type="button" data-mtab="files"><i>🗂</i>文件</button>
        <button type="button" data-mtab="view"><i>👁</i>预览</button>
      </nav>
    </div>

    <dialog class="rename-dialog new-thread-dialog" id="new-thread-dialog" tabindex="-1" aria-labelledby="new-thread-title" aria-describedby="new-thread-help">
      <form id="new-thread-form">
        <p class="eyebrow">新建会话</p>
        <h2 id="new-thread-title">选择提供商和模型</h2>
        <p class="dialog-copy" id="new-thread-help">此选择仅对当前新会话生效，不会改变运行时的默认设置。</p>

        <label class="dialog-field">
          <span class="dialog-label">提供商</span>
          <select id="new-thread-provider" required disabled></select>
        </label>

        <label class="dialog-field" id="new-thread-model-select-field">
          <span class="dialog-label">模型</span>
          <select id="new-thread-model" required disabled></select>
        </label>

        <label class="dialog-field" id="new-thread-model-input-field" hidden>
          <span class="dialog-label">模型</span>
          <input id="new-thread-model-input" type="text" autocomplete="off" spellcheck="false" required disabled>
        </label>

        <p class="model-capability" id="new-thread-capability" data-state="unknown" aria-live="polite"></p>
        <p class="dialog-status" id="new-thread-status" role="status" aria-live="polite"></p>

        <div class="dialog-actions">
          <button class="quiet-button" id="new-thread-cancel" type="button" autofocus>取消</button>
          <button class="primary-button" id="new-thread-create" type="submit" disabled>创建会话</button>
        </div>
      </form>
    </dialog>

    <dialog class="rename-dialog" id="rename-dialog">
      <form method="dialog" id="rename-form">
        <p class="eyebrow">会话标题</p>
        <h2>重命名此会话</h2>
        <label>
          <span class="sr-only">新的会话标题</span>
          <input id="rename-input" type="text" maxlength="160" required autocomplete="off">
        </label>
        <div class="dialog-actions">
          <button class="quiet-button" value="cancel" type="submit" formnovalidate>取消</button>
          <button class="primary-button" value="save" type="submit">保存标题</button>
        </div>
      </form>
    </dialog>

    <dialog class="rename-dialog" id="archived-dialog">
      <div class="dialog-head">
        <p class="eyebrow">会话管理</p>
        <h2>已归档的会话</h2>
        <button class="quiet-button" id="archived-close" type="button" style="position:absolute;top:12px;right:12px">✕</button>
      </div>
      <nav class="thread-list" id="archived-list"></nav>
      <p class="mut" id="archived-empty" hidden>还没有归档的会话。</p>
    </dialog>

    <noscript>AsBudy 网页版需要 JavaScript 才能连接本地运行时。</noscript>
  </body>
</html>
