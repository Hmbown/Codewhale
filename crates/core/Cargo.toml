[package]
name = "codewhale-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Core runtime boundaries for Codewhale"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
thiserror.workspace = true
codewhale-config = { path = "../config", version = "0.10.1" }
codewhale-hooks = { path = "../hooks", version = "0.10.1" }
codewhale-protocol = { path = "../protocol", version = "0.10.1" }
codewhale-state = { path = "../state", version = "0.10.1" }
regex = "1.11"
sha2.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }
